<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title><!DOCTYPE html>
    <html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>VAULT-TEC PIP-BOY 3000</title>
        <link rel="stylesheet" href="style.css">
        <!-- Wir importieren eine passende Schriftart von Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    </head>
    <body>
    
        <div class="pipboy-container">
            <!-- Scanline-Effekt-Overlay -->
            <div class="scanline"></div>
    
            <header>
                <h1>PIP-BOY 3000</h1>
                <nav>
                    <a href="#" class="active">STATUS</a>
                    <a href="#">INVENTAR</a>
                    <a href="#">DATEN</a>
                    <a href="#">KARTE</a>
                    <a href="#">RADIO</a>
                </nav>
            </header>
    
            <main>
                <h2>STATUS</h2>
                <hr>
                <div class="content-grid">
                    <div class="status-item">
                        <h3>ZUSTAND</h3>
                        <p>OK</p>
                    </div>
                    <div class="status-item">
                        <h3>RAD</h3>
                        <p>0</p>
                    </div>
                    <div class="status-item">
                        <h3>EP</h3>
                        <p>1500 / 2000</p>
                    </div>
                </div>
                
                <p class="entry">
                    > Willkommen im Ödland.
                    <span class="cursor">█</span>
                </p>
                <p class="entry">> System-Scan abgeschlossen. Alle Werte im grünen Bereich.</p>
                <p class="entry">> Überlebenswahrscheinlichkeit: 37%</p>
            </main>
    
            <footer>
                <div>HP 90/90</div>
                <div>LVL 5</div>
                <div>AP 75/75</div>
            </footer>
        </div>
    
    </body>
    </html>
    </title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
</head>
<body>
    
</body>
</html>
